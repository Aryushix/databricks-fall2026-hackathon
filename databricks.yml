# OPTIONAL: Declarative Automation Bundle (formerly Databricks Asset Bundles).
# Lets one command create the pipeline and a scheduled refresh job from this repo:
#   databricks bundle validate
#   databricks bundle deploy          # creates "[dev <you>] hackathon-..." resources
#   databricks bundle run refresh     # runs notebooks 01 -> 02 -> 03 -> 05
# You can ignore this file and run the notebooks by hand instead.

bundle:
  name: databricks-fall2026-hackathon

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace
  schema:
    description: Schema that holds every hackathon table
    default: hackathon
  dataset:
    description: Folder under /Volumes/<catalog>/<schema>/raw/ to ingest
    default: orders

resources:
  pipelines:
    etl:
      name: hackathon-etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      libraries:
        - file:
            path: ./pipelines/etl.py
      configuration:
        hackathon.catalog: ${var.catalog}
        hackathon.schema: ${var.schema}
        hackathon.dataset: ${var.dataset}

  jobs:
    refresh:
      name: hackathon-refresh
      # No cluster settings: tasks run on serverless compute.
      tasks:
        - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/01_ingest_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              dataset: ${var.dataset}
        - task_key: clean_silver
          depends_on:
            - task_key: ingest_bronze
          notebook_task:
            notebook_path: ./notebooks/02_clean_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              dataset: ${var.dataset}
        - task_key: gold_tables
          depends_on:
            - task_key: clean_silver
          notebook_task:
            notebook_path: ./notebooks/03_gold_tables.sql
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: rag_index
          depends_on:
            - task_key: gold_tables
          notebook_task:
            notebook_path: ./notebooks/05_build_rag_index.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

targets:
  dev:
    mode: development
    default: true
