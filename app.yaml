# Databricks Apps configuration. Deploy the app with the repo's Git folder as
# its source path; Databricks installs requirements.txt and runs this command.
command: ['streamlit', 'run', 'app/app.py']

env:
  - name: 'HACKATHON_CATALOG'
    value: 'workspace'
  - name: 'HACKATHON_SCHEMA'
    value: 'hackathon'
  - name: 'HACKATHON_LLM_ENDPOINT'
    value: 'databricks-gpt-oss-120b'
  # Find care page (app/pages/1_Find_care.py): facility + verification files, never in Git
  - name: 'NAV_DATA_DIR'
    value: '/Volumes/workspace/hackathon/raw/navigation'
  - name: 'STREAMLIT_GATHER_USAGE_STATS'
    value: 'false'
