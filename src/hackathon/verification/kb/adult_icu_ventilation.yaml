canonical_name: Adult ICU with ventilation
category: critical care
specialization: advanced
plausible_facility_types: [hospital]

synonyms:
  - '\b(?:medical |surgical |adult |general )?icu\b'
  - '\bintensive care (?:unit|units|services?|facility|facilities)\b'
  - '\bcritical care (?:unit|units|services?|facility|facilities|department)\b'
  - '\b(?:micu|sicu)\b'

children:
  - id: ventilation
    patterns: ['\bventilators?\b', '\bmechanical ventilation\b', '\bventilator (?:support|beds?)\b']
  - id: hdu
    patterns: ['\bhigh dependency unit\b', '\bhdu\b']

ambiguous: []

confusables:
  - id: neonatal_paediatric_icu
    why: a newborn or child ICU, not an adult ICU
    patterns: ['\b(?:nicu|picu|sncu)\b', '\b(?:neonatal|newborn|paediatric|pediatric) (?:icu|intensive care)\b']
  - id: mobile_or_home_icu
    why: an ambulance or home service, not an ICU bed
    patterns: ['\bicu (?:ambulances?|on wheels)\b', '\b(?:home|mobile) icu\b', '\bicu at home\b', '\bicu care at home\b']
  - id: cardiothoracic_icu
    why: covered by the cath / cardiac KBs, not general adult ICU
    patterns: ['\bct ?icu\b', '\bcvts? icu\b']
  - id: non_medical_ventilation
    why: building ventilation
    patterns: ['\b(?:natural|cross|good|proper) ventilation\b']

