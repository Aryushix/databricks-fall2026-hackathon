# Service catalog for the NGO service finder (navigation/matcher.py). Keys are care-need ids from
# configs/care_needs.yaml. A service with `kb_id` is matched by its verifier KB (path A: CONFIRMED / LIKELY records,
# with look-alike and negation rules). A service without one is matched on the 4 claim pillars (path B):
# equipment, procedures, specialties, capabilities. Path B results are a separate SEMANTIC_MATCH tier: not verified.
# DRAFT requirement profiles (2026-11-22): a clinician should review them.

version: "1.0.0"
pillar_weights: {procedures: 0.35, equipment: 0.30, specialties: 0.20, capabilities: 0.15}
