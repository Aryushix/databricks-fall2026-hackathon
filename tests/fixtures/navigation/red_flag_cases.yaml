  - "my knee hurts when climbing stairs for months"
  - "bad toothache since yesterday"
  - "mild headache today"
  - "I'm on dialysis and moved to Pune"
  - "no chest pain, just a dry cough"
  - "seene mein dard nahi hai, bas khansi hai"
  - "vision getting blurry over the past year"
  - "I have a cold and runny nose"
  - "lower back pain for two weeks"
  - "my skin is itchy"
  - "heartburn after spicy food"
  - "burning sensation when I pass urine"
  - "I need a routine checkup"
  - "sore throat and mild fever"
  - "pet mein halka dard hai"
  - "I am pregnant and want a regular checkup"
