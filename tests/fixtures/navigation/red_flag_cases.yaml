    - "electric shock while fixing a wire"
    - "acid fell on her hand"
    - "large burns on the chest from a fire"
    - "current lag gaya"
    - "haath aag se jal gaya bahut"
    - "chemical burn on my arm at the factory"
    - "she was badly burnt in a kitchen fire"
    - "बच्चा जल गया"
    - "tezaab gir gaya"
    - "burnt my finger on the stove"
    - "scalded with hot oil all over the leg"
  pregnancy_emergency:
