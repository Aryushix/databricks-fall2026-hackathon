    - "difficulty breathing since an hour"
    - "my son is choking on something"
    - "her lips are turning blue"
    - "saans nahi aa rahi"
    - "saans lene mein bahut taklif ho rahi hai"
    - "सांस लेने में तकलीफ हो रही है"
    - "I am gasping for air"
    - "very short of breath even when resting"
    - "dam ghut raha hai"
    - "not able to breathe lying down"
    - "breathing is very difficult"
  major_trauma_bleeding:
