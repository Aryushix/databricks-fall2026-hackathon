    - "chhat se gir gaya"
    - "खून नहीं रुक रहा"
    - "my father had an acident on the highway"
    - "deep cut on the hand bleeding heavily"
    - "fallen from a ladder at work"
    - "stabbed in the stomach"
    - "एक्सीडेंट हो गया है"
  burns:
