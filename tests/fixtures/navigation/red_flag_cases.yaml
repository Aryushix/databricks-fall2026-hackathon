# SYNTHETIC test phrasings for the red-flag screen. Written for testing; no real patient messages.
# `positives`: every phrasing must fire its category (CI gate: 100% recall).
# `negatives`: should not fire any rule. Misses here are over-triage: reported, not gated,
# except the negation cases in tests/test_navigation_red_flags.py, which are asserted one by one.

positives:
  possible_heart_attack:
    - "I have chest pain"
    - "severe chest pain since 20 minutes and sweating"
    - "chest pian spreading to my left arm"
    - "there is a heavy pressure on my chest"
    - "my chest feels tight and I am sweating a lot"
    - "pain in my chest going to the jaw"
    - "i think im having a heart attack"
    - "seene mein bahut dard ho raha hai"
    - "chhati me dard aur pasina aa raha hai"
    - "सीने में दर्द हो रहा है"
    - "dil mein dard ho raha hai"
    - "chets pain and cant stand"
    - "left arm pain with sweating and feeling sick"
    - "papa ko heart attack jaisa lag raha hai"
    - "pain started in the chest and now radiating to the shoulder"
  possible_stroke:
    - "her face is drooping on one side"
    - "suddenly my left side is weak and numb"
    - "he has slurred speech since morning"
    - "my father can't speak properly all of a sudden"
    - "worst headache of my life came on suddenly"
    - "papa ka muh tedha ho gaya hai"
    - "mummy ko lakwa maar gaya lagta hai"
    - "उनका मुंह टेढ़ा हो गया है"
    - "sudden confusion and he doesnt recognise us"
    - "one side of the body is not moving"
    - "zubaan ladkhada rahi hai"
    - "i think she is having a brain stroke"
    - "achanak bahut tez sir dard"
    - "weakness on the right side and drooping smile"
  breathing_difficulty:
